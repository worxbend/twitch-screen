[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "twitch-screen-client"
version = "0.1.0"
description = "Private-network Linux desk display companion"
requires-python = ">=3.12"
dependencies = ["dbus-fast==5.2.0", "httpx==0.28.1"]

[project.scripts]
twitch-screen-client = "twitch_screen_client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/twitch_screen_client"]

[tool.hatch.build.targets.wheel.force-include]
"config.example.toml" = "twitch_screen_client/config.example.toml"
"systemd/twitch-screen-client.service" = "twitch_screen_client/twitch-screen-client.service"
