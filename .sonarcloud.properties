# SonarQube Cloud automatic analysis settings.

# Production code is everything except the three test trees; those are
# analysed as tests so production-only rules and metrics do not apply to them.
sonar.sources=.
sonar.exclusions=twitch-screen-firmware/test/**,twitch-screen-relay/test/**,tools/tests/**
sonar.tests=twitch-screen-firmware/test,twitch-screen-relay/test,tools/tests

# Generated from twitch-screen-firmware/docs/PROTOCOL.md by gen_vectors.py;
# CI fails if it drifts, so it is never edited by hand.
sonar.test.exclusions=twitch-screen-firmware/test/test_proto_codec/vectors.h

# Both firmware targets (ESP32 Arduino core and the native test env) compile
# with -std=gnu++11; rules that need a newer standard cannot be applied.
sonar.cfamily.reportingCppStandardOverride=c++11

sonar.python.version=3.13
