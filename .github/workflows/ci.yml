name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: twitch-screen-relay
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: relay-${{ runner.os }}-${{ hashFiles('twitch-screen-relay/build.mill', 'twitch-screen-relay/mill') }}
      - run: ./mill compile
      - name: Prepare isolated relay test scratch
        run: |
          mkdir -p "$RUNNER_TEMP/twitch-screen-relay"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/twitch-screen-relay" >> "$GITHUB_ENV"
      - name: Audit resolved runtime dependencies
        working-directory: .
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 tools/audit_relay_dependencies.py
      # test is a cached task alias; testForked is the fresh test command.
      - name: Execute fresh relay tests
        run: ./mill --no-server -j 1 test.testForked
      - run: ./mill --no-server mill.scalalib.scalafmt/checkFormatAll

  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare isolated contract test scratch
        run: |
          mkdir -p "$RUNNER_TEMP/twitch-screen-protocol"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/twitch-screen-protocol" >> "$GITHUB_ENV"
      - run: python3 tools/check_protocol_vectors.py
      - run: python3 tools/check_desk_contract.py
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 -m unittest discover -s twitch-screen-relay/tools/tests -v
      - run: python3 twitch-screen-firmware/tools/test_production_restart_oracle.py
      - name: Verify shipped panel epoch and local-expiry authority
        run: |
          node --version
          node --test twitch-screen-relay/tools/tests/panel_authority.cjs
          node twitch-screen-relay/tools/tests/panel_epoch.cjs
      - run: python3 -m compileall -q twitch-screen-cad-design/scripts twitch-screen-firmware/tools tools

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: twitch-screen-firmware
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            twitch-screen-firmware/.pio/libdeps
          key: firmware-${{ runner.os }}-${{ hashFiles('twitch-screen-firmware/platformio.ini') }}
      - name: Prepare isolated firmware test scratch
        run: |
          mkdir -p "$RUNNER_TEMP/twitch-screen-firmware"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/twitch-screen-firmware" >> "$GITHUB_ENV"
      - run: python -m pip install --only-binary ':all:' platformio==6.1.18
      - run: python tools/test_runner_contract.py
      - run: pio test -e native
      - run: pio test -e native-sanitized
      - run: pio test -e native-lvgl
      - run: pio test -e native-lvgl-base
      - run: pio test -e native-generic
      - name: Verify actual application peer and fail-closed capable verdict
        env:
          RECOVERY_EVIDENCE: ${{ runner.temp }}/firmware-recovery
        run: |
          pio test -e native-runtime-peer --without-testing
          python tools/test_runtime_peer.py --binary .pio/build/native-runtime-peer/program
          python tools/test_capable_pairing.py --binary .pio/build/native-runtime-peer/program
          python tools/test_runtime_recovery.py --binary .pio/build/native-runtime-peer/program --evidence "$RECOVERY_EVIDENCE"
          python tools/test_recovery_freshness.py --evidence "$RECOVERY_EVIDENCE"
          python tools/test_capable_reconnect.py --binary .pio/build/native-runtime-peer/program
          python tools/test_runtime_failures.py --binary .pio/build/native-runtime-peer/program
          python tools/test_pairing_runbook.py
          python tools/test_runtime_lifecycle.py
          python tools/test_production_observer.py -v
          python tools/test_runtime_observations.py -v
      - name: Prepare example credentials without overwriting a header
        run: test ! -e src/credentials.h && cp src/credentials.example.h src/credentials.h
      - run: pio run -e esp32dev

  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: twitch-screen-client
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare synthetic test environment
        run: |
          mkdir -p "$RUNNER_TEMP/twitch-screen-client"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/twitch-screen-client" >> "$GITHUB_ENV"
          command -v dbus-daemon
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.lock -r requirements-build.lock
      - run: PYTHONPATH=src .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python -m pip check
      - run: .venv/bin/python -m hatchling build -t wheel
      - run: .venv/bin/python tools/check_package.py dist/twitch_screen_client-0.1.0-py3-none-any.whl
      - run: .venv/bin/python -m pip install --no-deps dist/twitch_screen_client-0.1.0-py3-none-any.whl
      - run: TSC_TEST_INSTALLED=1 PYTHONPATH= .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/twitch-screen-client check-config --config config.example.toml

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Exercise the small-runner carrier topology, including SSE cancellation.
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Baseline firmware adapters read immutable historical source via git show.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare isolated production acceptance tools
        run: |
          mkdir -p "$RUNNER_TEMP/twitch-screen-integration"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/twitch-screen-integration" >> "$GITHUB_ENV"
          command -v dbus-daemon
          python -m pip install --only-binary ':all:' platformio==6.1.18
          python -m venv twitch-screen-client/.venv
          twitch-screen-client/.venv/bin/python -m pip install --require-hashes -r twitch-screen-client/requirements.lock -r twitch-screen-client/requirements-build.lock
          (cd twitch-screen-client && .venv/bin/python -m hatchling build -t wheel && .venv/bin/python -m pip install --no-deps dist/twitch_screen_client-0.1.0-py3-none-any.whl)
      - name: Build exact native application and production relay
        run: |
          pio test -d twitch-screen-firmware -e native-runtime-peer --without-testing
          (cd twitch-screen-relay && ./mill --no-server -j 1 assembly)
      - name: Verify actual Main TCP, canonical SSE and chronological baseline
        run: |
          python twitch-screen-relay/tools/check_admin_runtime.py --assembly twitch-screen-relay/out/assembly.dest/out.jar --native twitch-screen-firmware/.pio/build/native-runtime-peer/program --slow-reader --evidence "$TMPDIR/admin-main"
          python twitch-screen-firmware/tools/test_runtime_failures.py --binary twitch-screen-firmware/.pio/build/native-runtime-peer/program --evidence "$TMPDIR/restart-active-socket"
          python twitch-screen-firmware/tools/test_production_restart.py --assembly twitch-screen-relay/out/assembly.dest/out.jar --binary twitch-screen-firmware/.pio/build/native-runtime-peer/program --test-owned --restart-mode observed --evidence "$TMPDIR/restart"
          python twitch-screen-firmware/tools/test_production_restart_verdict.py --evidence "$TMPDIR/restart"
          python twitch-screen-firmware/tools/test_production_restart.py --assembly twitch-screen-relay/out/assembly.dest/out.jar --binary twitch-screen-firmware/.pio/build/native-runtime-peer/program --test-owned --restart-delay-seconds 15 --restart-mode completed-originals --evidence "$TMPDIR/restart-delayed"
          python twitch-screen-firmware/tools/test_production_restart_verdict.py --evidence "$TMPDIR/restart-delayed"
          PYTHONPATH= twitch-screen-client/.venv/bin/python twitch-screen-client/tools/check_runtime_admin.py --assembly twitch-screen-relay/out/assembly.dest/out.jar --test-owned --evidence "$TMPDIR/producer-admin"

      - name: Verify real process-gap freshness and global card chronology
        run: |
          python twitch-screen-firmware/tools/test_production_suspend.py --assembly twitch-screen-relay/out/assembly.dest/out.jar --binary twitch-screen-firmware/.pio/build/native-runtime-peer/program --test-owned --evidence "$TMPDIR/suspend"
          python twitch-screen-firmware/tools/test_production_suspend_verdict.py --evidence "$TMPDIR/suspend"
      - name: Prepare pinned test-only Chromium for authority races
        run: |
          twitch-screen-client/.venv/bin/python -m pip install --require-hashes --only-binary=:all: -r site/requirements-browser.lock
          twitch-screen-client/.venv/bin/python -m playwright install-deps chromium
          python site/tools/install_browser.py --output "$TMPDIR/browser"
      - name: Verify real browser epoch races and local source/report expiry
        run: |
          twitch-screen-client/.venv/bin/python twitch-screen-relay/tools/check_admin_authority.py --assembly twitch-screen-relay/out/assembly.dest/out.jar --native twitch-screen-firmware/.pio/build/native-runtime-peer/program --browser-executable "$TMPDIR/browser/chrome-headless-shell-linux64/chrome-headless-shell" --evidence "$TMPDIR/admin-authority"
      - name: Verify real panel workflows on the final Main and native artifacts
        run: |
          twitch-screen-client/.venv/bin/python twitch-screen-relay/tools/check_admin_runtime.py --assembly twitch-screen-relay/out/assembly.dest/out.jar --native twitch-screen-firmware/.pio/build/native-runtime-peer/program --slow-reader --browser-executable "$TMPDIR/browser/chrome-headless-shell-linux64/chrome-headless-shell" --evidence "$TMPDIR/admin-browser"
      - name: Verify installed producer to real Compose/native/SSE/Chromium
        run: |
          docker build -t twitch-screen-relay:integration twitch-screen-relay
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' twitch-screen-relay:integration)
          TSC_TEST_INSTALLED=1 PYTHONPATH= twitch-screen-client/.venv/bin/python twitch-screen-client/tools/check_runtime_device.py --image-id "$IMAGE_ID" --binary twitch-screen-firmware/.pio/build/native-runtime-peer/program --browser-executable "$TMPDIR/browser/chrome-headless-shell-linux64/chrome-headless-shell" --test-owned --evidence "$TMPDIR/producer-normal"
          TSC_TEST_INSTALLED=1 PYTHONPATH= twitch-screen-client/.venv/bin/python twitch-screen-client/tools/check_runtime_device.py --image-id "$IMAGE_ID" --binary twitch-screen-firmware/.pio/build/native-runtime-peer/program --browser-executable "$TMPDIR/browser/chrome-headless-shell-linux64/chrome-headless-shell" --test-owned --deny-monitor --evidence "$TMPDIR/producer-denied"
          TSC_TEST_INSTALLED=1 PYTHONPATH= twitch-screen-client/.venv/bin/python twitch-screen-client/tools/check_runtime_device.py --image-id "$IMAGE_ID" --binary twitch-screen-firmware/.pio/build/native-runtime-peer/program --browser-executable "$TMPDIR/browser/chrome-headless-shell-linux64/chrome-headless-shell" --test-owned --malformed-response --evidence "$TMPDIR/producer-malformed"

      # Allowlist synthetic diagnostics only: no runtime state, tokens, browser
      # profiles, screenshots, binaries, or wholesale TMPDIR uploads.
      - name: Retain synthetic baseline diagnostics on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-baseline-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/twitch-screen-integration/restart/fixture.json
            ${{ runner.temp }}/twitch-screen-integration/restart/observations.jsonl
            ${{ runner.temp }}/twitch-screen-integration/restart/cleanup.json
            ${{ runner.temp }}/twitch-screen-integration/restart/verified.json
            ${{ runner.temp }}/twitch-screen-integration/restart/peer-stderr.log
            ${{ runner.temp }}/twitch-screen-integration/restart-delayed/fixture.json
            ${{ runner.temp }}/twitch-screen-integration/restart-delayed/observations.jsonl
            ${{ runner.temp }}/twitch-screen-integration/restart-delayed/cleanup.json
            ${{ runner.temp }}/twitch-screen-integration/restart-delayed/verified.json
            ${{ runner.temp }}/twitch-screen-integration/restart-delayed/peer-stderr.log
            ${{ runner.temp }}/twitch-screen-integration/admin-main/result.json
            ${{ runner.temp }}/twitch-screen-integration/admin-main/test_legacy_production.py.log
            ${{ runner.temp }}/twitch-screen-integration/admin-main/test_legacy_production_verdict.py.log
            ${{ runner.temp }}/twitch-screen-integration/admin-main/legacy-running/build.log
            ${{ runner.temp }}/twitch-screen-integration/admin-main/legacy-running/peer-stderr.log
            ${{ runner.temp }}/twitch-screen-integration/admin-browser/result.json
            ${{ runner.temp }}/twitch-screen-integration/admin-browser/test_legacy_production.py.log
            ${{ runner.temp }}/twitch-screen-integration/admin-browser/test_legacy_production_verdict.py.log
            ${{ runner.temp }}/twitch-screen-integration/admin-browser/legacy-running/build.log
            ${{ runner.temp }}/twitch-screen-integration/admin-browser/legacy-running/peer-stderr.log

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: docker build --check twitch-screen-relay
      - run: docker build -t twitch-screen-relay:ci twitch-screen-relay
      - run: python3 tools/smoke_container.py twitch-screen-relay:ci

  required:
    name: Verify required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [relay, protocol, firmware, companion, integration, container]
    if: ${{ always() }}
    steps:
      - name: Require every verification job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          expected = {'relay', 'protocol', 'firmware', 'companion', 'integration', 'container'}
          results = json.loads(os.environ['NEEDS_JSON'])
          if not isinstance(results, dict) or set(results) != expected:
              raise SystemExit('Missing or unexpected required verification jobs')
          failed = [name for name, row in results.items()
                    if not isinstance(row, dict) or row.get('result') != 'success']
          if failed:
              raise SystemExit('Required verification did not succeed: ' + ', '.join(sorted(failed)))
          print('Every required verification job succeeded')
          PY
