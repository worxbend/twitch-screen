; Waveshare 1.28" round LCD (GC9A01, 240x240, SPI) + ESP32 DevKit V1 (WROOM-32)
;
; TFT_eSPI is configured entirely via build_flags below, so there is no
; User_Setup.h to edit inside the library.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    ; SPI wiring (see README section in main.cpp header)
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=4
    -D TFT_BL=15
    -D TFT_BACKLIGHT_ON=HIGH
    ; 40 MHz: proven wiring; raise to 80000000 if the panel stays clean
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; LVGL: use project-local include/lv_conf.h
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I include

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.4.2
    lvgl/lvgl @ ^9.2.2
