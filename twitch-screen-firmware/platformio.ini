; Waveshare 1.28" round LCD (GC9A01, 240x240, SPI) + ESP32 DevKit V1 (WROOM-32)
;
; Firmware speaks TSB/3 (docs/PROTOCOL.md) to the relay on TCP 8099.
;
; TFT_eSPI is configured entirely via build_flags below, so there is no
; User_Setup.h to edit inside the library.

[platformio]
; `pio run` builds the firmware and nothing else. `[env:native]` below is a host
; environment for `pio test`; without this line `pio run` would try to build the
; ESP32 sources with the host compiler and fail on the first <Arduino.h>.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 7.1.2
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32 @ 4.20017.260907+sha.dcc1105b
board_build.partitions = huge_app.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/build_version.py
build_src_flags = -Wall -Wextra -Werror
upload_speed = 460800

build_flags =
    -D USER_SETUP_LOADED=1
    ; This board has no touch controller; suppress TFT_eSPI optional-touch notice.
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    ; SPI wiring (see README section in main.cpp header)
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=4
    -D TFT_BL=15
    -D TFT_BACKLIGHT_ON=HIGH
    ; 40 MHz: proven wiring; raise to 80000000 if the panel stays clean
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; LVGL: use project-local include/lv_conf.h
    -D LV_CONF_INCLUDE_SIMPLE=1
    ; Drop LVGL's api_map headers so deprecated v8/v9.x names fail the build (FW-08).
    -D LV_DISABLE_API_MAPPING=1
    -I include

; ArduinoJson was removed when link_client.cpp stopped speaking NDJSON v2.
; TSB/3 (docs/PROTOCOL.md) is fixed-offset binary decoded by src/proto_codec.cpp,
; which allocates nothing on the read path; the per-frame heap-allocating
; JsonDocument is gone with it, and nothing firmware-wide references the library
; any more.
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    lvgl/lvgl @ 9.6.0

; §17: "Both suites MUST run under a command the repository configures." Before this
; env existed, test/test_proto_codec and test/test_link_wire were plain int main()
; programs that only ran if a human typed the g++ line out of a comment — so a future
; edit that moved `actor` from +24 to +28 left `pio run` green and shipped, and the
; first symptom was a card on the 240x240 display whose title was four bytes of the
; previous field. Both suites now run, on the host, with:
;
;     ../.venv-pio/bin/pio test -e native      (from twitch-screen-firmware; setup in README.md)
;
; `test_framework = custom` is what lets a plain `int main()` returning non-zero on
; failure be the test: these suites predate Unity here and assert the SPEC's bytes,
; which is the property §18 exists for and which a framework would not improve.
[env:native]
platform = native @ 1.2.1
test_framework = custom

; Host tests compile the codec and transport-independent link session. Other
; src/ files need Arduino/LVGL. notification.h, notification_wire.h and notify_queue.h
; are header-only and freestanding by design, exactly so this works.
test_build_src = yes
build_src_filter = +<proto_codec.cpp> +<link_client.cpp>

build_flags =
    -std=gnu++11
    -Wall
    -Wextra
    -Werror
    -I src
    ; test_link_wire drives the queue and the card binding with the same golden
    ; vectors, which are generated once into the sibling test directory.
    -I test/test_proto_codec

; Linux host gate: deterministic fuzz/session tests under ASan + UBSan.
[env:native-sanitized]
extends = env:native
extra_scripts = pre:tools/sanitizers.py
build_flags =
    ${env:native.build_flags}
    -fsanitize=address,undefined
    -fno-sanitize-recover=all
    -fno-omit-frame-pointer
    -fno-pie
    -g
    -O1
