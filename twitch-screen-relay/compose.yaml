# A relay on the LAN the ESP32 can reach. Set management credentials before `docker compose up`:
# with twitch.mode = simulated it generates events itself, so no Twitch credentials are needed to test the firmware.
services:
  relay:
    build: .
    # The device connects to a fixed address, so the relay keeps the same ports on the host.
    ports:
      - "8080:8080"   # management API and Swagger UI
      - "8099:8099"   # device link
    environment:
      RELAY_TWITCH_MODE: live
      RELAY_TWITCH_CHANNEL: worxbend
      RELAY_TWITCH_CLIENT_ID: ${RELAY_TWITCH_CLIENT_ID:-}
      RELAY_TWITCH_CLIENT_SECRET: ${RELAY_TWITCH_CLIENT_SECRET:-}
      RELAY_CHAT_NOTIFICATIONS: ${RELAY_CHAT_NOTIFICATIONS:-}
      # Configure at least one complete method. Missing/invalid credentials fail startup.
      RELAY_HTTP_AUTH_API_TOKEN: ${RELAY_HTTP_AUTH_API_TOKEN:-}
      RELAY_HTTP_AUTH_BASIC_USERNAME: ${RELAY_HTTP_AUTH_BASIC_USERNAME:-}
      RELAY_HTTP_AUTH_BASIC_PASSWORD_HASH: ${RELAY_HTTP_AUTH_BASIC_PASSWORD_HASH:-}
      # For a real channel, set these instead and change the mode to `live`:
      # RELAY_TWITCH_MODE: live
      # RELAY_TWITCH_CHANNEL: yourchannel
      # RELAY_TWITCH_CLIENT_ID: ...
      # RELAY_TWITCH_CLIENT_SECRET: ...
      # Then open http://localhost:8080/api/v1/twitch/authorize once to grant the broadcaster token.
    volumes:
      - relay-data:/home/relay/data   # the granted Twitch token
    # Starting budget; measure under your stream/device load before raising limits.
    mem_limit: 512m
    restart: unless-stopped

volumes:
  relay-data:
