# Every value can be overridden by the environment variable named beside it, so the
# Docker image needs no config file of its own. See README.md for the full table.

http {
  host = "0.0.0.0"
  host = ${?RELAY_HTTP_HOST}
  port = 8080
  port = ${?RELAY_HTTP_PORT}
}

device-link {
  host = "0.0.0.0"
  host = ${?RELAY_DEVICE_HOST}
  port = 8099
  port = ${?RELAY_DEVICE_PORT}

  # Bumping this rejects older firmware at the handshake instead of confusing it later.
  protocol-version = 2

  accept-backlog = 16

  # The firmware expects `welcome` within 5s of connecting.
  handshake-timeout = 5 seconds

  # The firmware declares the link dead after 45s of silence; we are more patient
  # than it is so that the device, not the server, decides when to reconnect.
  idle-timeout = 90 seconds
  idle-timeout = ${?RELAY_DEVICE_IDLE_TIMEOUT}

  ping-interval = 20 seconds

  # Frames buffered per device before the slowest device starts losing pushes
  # rather than stalling every other device.
  outbound-queue-capacity = 128

  # `hello` replays notifications newer than the device's last_seq out of this buffer.
  replay-buffer-size = 64

  # Longest accepted inbound line; the firmware's own buffer is 512 bytes.
  max-frame-length = 512
}

twitch {
  # disabled | simulated | live
  mode = disabled
  mode = ${?RELAY_TWITCH_MODE}

  channel = ""
  channel = ${?RELAY_TWITCH_CHANNEL}

  client-id = ""
  client-id = ${?RELAY_TWITCH_CLIENT_ID}
  client-secret = ""
  client-secret = ${?RELAY_TWITCH_CLIENT_SECRET}

  # Broadcaster user token: needed for subscriber and follower totals.
  user-access-token = ""
  user-access-token = ${?RELAY_TWITCH_USER_TOKEN}

  # Chat (IRC) token. Empty means anonymous read-only chat, which is enough for chat rate and message events.
  chat-access-token = ""
  chat-access-token = ${?RELAY_TWITCH_CHAT_TOKEN}

  event-sub {
    # websocket | webhook
    transport = websocket
    transport = ${?RELAY_TWITCH_EVENTSUB_TRANSPORT}

    # Webhook transport only: the public HTTPS URL Twitch posts to. Must end in /api/v1/twitch/eventsub.
    callback-url = ""
    callback-url = ${?RELAY_TWITCH_EVENTSUB_CALLBACK_URL}
    secret = ""
    secret = ${?RELAY_TWITCH_EVENTSUB_SECRET}
  }

  # How often Helix is polled for viewer, follower and subscriber totals.
  poll-interval = 30 seconds
  poll-interval = ${?RELAY_TWITCH_POLL_INTERVAL}

  simulation {
    interval = 12 seconds
    interval = ${?RELAY_SIMULATION_INTERVAL}
    chat-interval = 2 seconds
  }
}

notifications {
  # How long the firmware keeps a notification on screen before returning to the idle dashboard.
  default-ttl = 30 seconds
  default-ttl = ${?RELAY_NOTIFICATION_TTL}

  # show | hide. A busy chat at 35 messages/min would bury every follow and raid, so chat is hidden by default.
  chat = hide
  chat = ${?RELAY_CHAT_NOTIFICATIONS}
}

bus {
  # Events queued per internal subscriber before that subscriber starts losing them.
  # Losing events in one consumer is preferred to stalling the producers.
  subscriber-queue-capacity = 1024
}

stats {
  # Cadence of the `stats` frame pushed to every connected device.
  broadcast-interval = 5 seconds
  broadcast-interval = ${?RELAY_STATS_INTERVAL}

  # Sliding window behind the messages-per-minute figure.
  chat-rate-window = 1 minute
}

activity {
  buffer-size = 500
  buffer-size = ${?RELAY_ACTIVITY_BUFFER_SIZE}
}

alerts {
  evaluation-interval = 15 seconds
  buffer-size = 100

  # Omit a duration to disable its rule.
  no-devices-connected-for = 2 minutes
  no-devices-connected-for = ${?RELAY_ALERT_NO_DEVICES_FOR}
  twitch-disconnected-for = 1 minute
  twitch-disconnected-for = ${?RELAY_ALERT_TWITCH_DISCONNECTED_FOR}
  # stream-offline-for is unset by default: an offline stream is normal, not an alert.
  stream-offline-for = ${?RELAY_ALERT_STREAM_OFFLINE_FOR}

  error-rate-threshold = 10
  error-rate-window = 5 minutes
}

observability {
  log-buffer-size = 500
}
