# Every value can be overridden by the environment variable named beside it, so the
# Docker image needs no config file of its own. See README.md for the full table.

http {
  host = "0.0.0.0"
  host = ${?RELAY_HTTP_HOST}
  port = 8080
  port = ${?RELAY_HTTP_PORT}
  auth {
    basic-username = ""
    basic-username = ${?RELAY_HTTP_AUTH_BASIC_USERNAME}
    basic-password-hash = ""
    basic-password-hash = ${?RELAY_HTTP_AUTH_BASIC_PASSWORD_HASH}
    api-token = ""
    api-token = ${?RELAY_HTTP_AUTH_API_TOKEN}
  }
}

device-link {
  host = "0.0.0.0"
  host = ${?RELAY_DEVICE_HOST}
  port = 8099
  port = ${?RELAY_DEVICE_PORT}

  # TSB/3, the binary protocol of twitch-screen-firmware/docs/PROTOCOL.md. The check is
  # exact equality (§7): a device speaking anything else is refused with BYE(1) and closed,
  # so a version skew is one log line on each side instead of a silent reconnect loop.
  protocol-version = 3

  accept-backlog = 16

  # The firmware expects `welcome` within 5s of connecting.
  handshake-timeout = 5 seconds

  # The firmware declares the link dead after 45s of silence; we are more patient
  # than it is so that the device, not the server, decides when to reconnect.
  idle-timeout = 90 seconds
  idle-timeout = ${?RELAY_DEVICE_IDLE_TIMEOUT}

  ping-interval = 20 seconds

  # Frames buffered per device before the slowest device starts losing pushes
  # rather than stalling every other device.
  outbound-queue-capacity = 128

  # `hello` replays notifications newer than the device's last_seq out of this buffer.
  replay-buffer-size = 64

  # Longest accepted frame, in BYTES, header included (§5: TSB3_MAX_FRAME). Not characters:
  # with a binary wire the true byte count is finally available, and every peer must accept 256.
  max-frame-length = 256
}

twitch {
  # disabled | simulated | live
  mode = disabled
  mode = ${?RELAY_TWITCH_MODE}

  channel = ""
  channel = ${?RELAY_TWITCH_CHANNEL}

  client-id = ""
  client-id = ${?RELAY_TWITCH_CLIENT_ID}
  client-secret = ""
  client-secret = ${?RELAY_TWITCH_CLIENT_SECRET}

  # The broadcaster's user token is never configured. Open GET /api/v1/twitch/authorize in a browser, approve
  # Twitch's consent screen, and Twitch redirects back to `redirect-url` with a code the relay exchanges for an
  # access and refresh token. Both are kept in `token-file` and refreshed before they expire, so consent is a
  # one-time step per deployment. Chat is read anonymously and needs no token at all.
  oauth {
    # Must be registered, byte for byte, as an OAuth Redirect URL of the application at dev.twitch.tv/console/apps.
    # Twitch accepts plain http only for localhost; from another machine, tunnel the port (ssh -L 8080:localhost:8080)
    # or put the relay behind HTTPS and set this to the public URL.
    redirect-url = "http://localhost:8080/api/v1/twitch/callback"
    redirect-url = ${?RELAY_TWITCH_REDIRECT_URL}

    # moderator:read:followers: follow events and the follower total. channel:read:subscriptions: the subscriber total.
    # Comma-separated in the environment variable.
    scopes = ["moderator:read:followers", "channel:read:subscriptions"]
    scopes = ${?RELAY_TWITCH_SCOPES}

    # Holds the access and refresh token, written with owner-only permissions. Relative to the working directory.
    token-file = "data/twitch-token.json"
    token-file = ${?RELAY_TWITCH_TOKEN_FILE}

    # Refresh user tokens this long before their provider-reported expiry.
    refresh-before = 15 minutes
  }

  event-sub {
    # websocket | webhook
    transport = websocket
    transport = ${?RELAY_TWITCH_EVENTSUB_TRANSPORT}

    # Webhook transport only: the public HTTPS URL Twitch posts to. Must end in /api/v1/twitch/eventsub.
    callback-url = ""
    callback-url = ${?RELAY_TWITCH_EVENTSUB_CALLBACK_URL}
    secret = ""
    secret = ${?RELAY_TWITCH_EVENTSUB_SECRET}
  }

  # How often Helix is polled for viewer, follower and subscriber totals.
  poll-interval = 30 seconds
  poll-interval = ${?RELAY_TWITCH_POLL_INTERVAL}

  simulation {
    interval = 12 seconds
    interval = ${?RELAY_SIMULATION_INTERVAL}
    chat-interval = 2 seconds
  }
}

notifications {
  # How long the firmware keeps a card posted to `POST /api/v1/notifications` on screen when the
  # post names no `ttlMs` of its own. It governs THAT PATH ONLY.
  #
  # A Twitch event's display time is per kind and is not configurable: §6.4.1 of the protocol fixes
  # it at 6 s for FOLLOW and CHAT, 8 s for SUB, GIFT, BITS and the generic kinds, 10 s for RAID and
  # the two stream transitions, and vectors V6-V15 pin every one of those on the wire. One uniform
  # value across all twelve kinds gave a follow the whole 240x240 display for as long as a stream
  # transition, and at 30 s it turned the reconnect replay burst into a four-minute slideshow.
  default-ttl = 8 seconds
  default-ttl = ${?RELAY_NOTIFICATION_TTL}

  # show | hide. A busy chat at 35 messages/min would bury every follow and raid, so chat is hidden by default.
  chat = hide
  chat = ${?RELAY_CHAT_NOTIFICATIONS}

  # Accounts whose chat messages and events never reach the wire, the replay buffer or the
  # chat counters (§13.1). Matching is on the lowercased, trimmed DISPLAY NAME, because the
  # relay carries no Twitch login: a bot that renames itself stops being matched until this
  # list is updated, and a human who sets their display name to one of these is suppressed.
  # Comma-separated in the environment variable.
  ignored-display-names = ["streamelements", "nightbot", "moobot", "streamlabs", "fossabot", "sery_bot"]
  ignored-display-names = ${?RELAY_IGNORED_DISPLAY_NAMES}
}

bus {
  # Events queued per internal subscriber before that subscriber starts losing them.
  # Losing events in one consumer is preferred to stalling the producers.
  subscriber-queue-capacity = 1024
}

stats {
  # Cadence of the `stats` frame pushed to every connected device.
  broadcast-interval = 5 seconds
  broadcast-interval = ${?RELAY_STATS_INTERVAL}

  # Sliding window behind the messages-per-minute figure.
  chat-rate-window = 1 minute
}

activity {
  buffer-size = 500
  buffer-size = ${?RELAY_ACTIVITY_BUFFER_SIZE}
}

alerts {
  evaluation-interval = 15 seconds
  buffer-size = 100

  # Omit a duration to disable its rule.
  no-devices-connected-for = 2 minutes
  no-devices-connected-for = ${?RELAY_ALERT_NO_DEVICES_FOR}
  twitch-disconnected-for = 1 minute
  twitch-disconnected-for = ${?RELAY_ALERT_TWITCH_DISCONNECTED_FOR}
  # stream-offline-for is unset by default: an offline stream is normal, not an alert.
  stream-offline-for = ${?RELAY_ALERT_STREAM_OFFLINE_FOR}

  error-rate-threshold = 10
  error-rate-window = 5 minutes
}

observability {
  log-buffer-size = 500
}
